# Local run with no PayPal credentials: Fake mode works out of the box.
#   docker compose up --build   then open http://localhost:8080 (token: dev-token)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pw
      POSTGRES_DB: payoutrescue
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://postgres:pw@db:5432/payoutrescue?sslmode=disable
      ADMIN_TOKEN: dev-token
      FAKE_ENABLED: "true"
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
volumes:
  pgdata:
