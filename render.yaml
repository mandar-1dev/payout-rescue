# Render Blueprint: one Docker web service + one Postgres database.
# Plan names change over time; check Render's current options before deploying.
services:
  - type: web
    name: payoutrescue
    runtime: docker
    plan: starter            # use a paid instance so webhooks are not missed while idle
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_MIGRATE
        value: "true"
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: FAKE_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: payoutrescue-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true     # read it from the Render dashboard after the first deploy
      - key: PUBLIC_BASE_URL
        sync: false             # e.g. https://payoutrescue.onrender.com (set after the first deploy)
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-haiku-5-5
      - key: PLATFORM_NAME
        value: Acme Creators

databases:
  - name: payoutrescue-db
    plan: basic-256mb        # check the plan's expiry and keep it alive until judging ends
